services:
  # Backend API Service
  - type: web
    name: delhi-pollution-api
    env: python
    plan: free
    region: oregon
    buildCommand: |
      apt-get update && apt-get install -y gdal-bin libgdal-dev libproj-dev proj-bin libgeos-dev libspatialindex-dev
      pip install --upgrade pip
      pip install -r Backend/requirements.txt
    startCommand: python -m uvicorn Backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.13
      - key: PORT
        value: 10000
