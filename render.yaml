services:
  # Backend API Service
  - type: web
    name: delhi-pollution-api
    env: python
    plan: free
    region: oregon
    buildCommand: bash render-build.sh
    startCommand: python -m uvicorn Backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.13
      - key: PORT
        value: 10000
